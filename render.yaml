## Render Blueprint for PayVerify AI.
##
## Deploys the backend + frontend as Docker-based web services on Render.
## Postgres and Redis are NOT defined here - per the project's DevOps plan,
## those are external managed services (Neon Postgres, Upstash Redis), wired
## in via the sync:false secrets below. See docs/deployment/render-deployment.md
## for the full setup walkthrough.
##
## After the first Blueprint deploy, double-check that the predictable
## "https://<service-name>.onrender.com" URLs used below (for CORS_ALLOWED_ORIGINS
## and NEXT_PUBLIC_API_BASE_URL) match what Render actually assigned - Render
## appends a random suffix if the plain name is already taken by another user.

services:
  - type: web
    name: payverify-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string - see deployment doc
      - key: REDIS_URL
        sync: false # Upstash Redis connection string - see deployment doc
      - key: GEMINI_API_KEY
        sync: false # optional - falls back to the deterministic stub explainer if blank
      - key: CORS_ALLOWED_ORIGINS
        value: https://payverify-frontend.onrender.com

  - type: web
    name: payverify-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 3000
      # Baked into the client bundle at Docker build time (Render translates
      # service env vars into Docker build ARGs automatically - see
      # https://render.com/docs/docker#environment-variable-translation).
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://payverify-backend.onrender.com
