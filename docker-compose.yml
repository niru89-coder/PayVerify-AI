services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payverify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payverify}
      POSTGRES_DB: ${POSTGRES_DB:-payverify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payverify} -d ${POSTGRES_DB:-payverify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [payverify]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [payverify]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payverify}:${POSTGRES_PASSWORD:-payverify}@postgres:5432/${POSTGRES_DB:-payverify}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
      # Auth (Phase 3.7) - off by default for a zero-friction `docker compose up`.
      # Set AUTH_ENABLED=true and provide JWT_SECRET/ADMIN_PASSWORD_HASH (see
      # scripts/hash_password.py) to exercise the production auth path locally.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000" # direct access for debugging / API docs at /docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [payverify]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000" # direct access for debugging
    depends_on:
      backend:
        condition: service_healthy
    networks: [payverify]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [payverify]

networks:
  payverify:
    driver: bridge

volumes:
  postgres_data:
