name: CI

# Runs on every PR targeting main/develop and on direct pushes to develop.
# Must pass before a PR can be merged (branch protection is configured on
# GitHub separately - this workflow only produces the status checks).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (install, lint, security scan, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      # Advisory only for now: the codebase has ~79 pre-existing style findings
      # (mostly stylistic - unsorted imports, mutable default args) that predate
      # this pipeline. Failing the build on day one would block all merges.
      # Tighten this (remove continue-on-error) once the backlog is cleaned up.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend (install, lint, build, security scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      # Advisory only: current high-severity findings are all in transitive
      # dev-tooling dependencies (eslint/next/postcss toolchain) that only have
      # fixes via breaking major upgrades. Revisit when upgrading Next.js.
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true
